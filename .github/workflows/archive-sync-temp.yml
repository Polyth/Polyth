name: Temporary archive sync

on:
  push:
    branches:
      - "feat/identity-governed-workspaces-20260916"
    paths:
      - ".github/workflows/archive-sync-temp.yml"

permissions:
  contents: write

concurrency:
  group: temporary-identity-archive-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean non-workflow snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE="d0525bc688f6e28b93d511cb03c042f8d6357e8e"
          EXPECTED_TREE="940a2798e03bae1127dcc3d9c059b1184d47414f"
          ARCHIVE="$RUNNER_TEMP/polyth-snapshot.zip"
          SNAPSHOT="$RUNNER_TEMP/polyth-snapshot"

          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 \
            'https://sdmntprnortheu.oaiusercontent.com/files/00000000-632c-81f4-a813-d97872c953e2/raw?se=2026-09-17T13%3A44%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=60e7a892-1859-5953-9713-081a0816864a&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T05%3A20%3A51Z&ske=2026-09-18T05%3A20%3A51Z&sks=b&skv=2026-02-06&sig=/jM4OLDYSN79jU6qP0riNKUc8z9NntaYmXNRDrkT36U%3D' \
            -o "$ARCHIVE"
          echo 'ab961e1be183ca2290d9df621c93b6bb1b172b094c747774887442f322869e0c  '"$ARCHIVE" | sha256sum -c -

          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"
          unzip -q "$ARCHIVE" -d "$SNAPSHOT"

          git reset --hard "$BASE"
          git clean -fdx
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$SNAPSHOT/" ./

          git add -A
          TREE="$(git write-tree)"
          if [[ "$TREE" != "$EXPECTED_TREE" ]]; then
            echo "Unexpected reconstructed tree: $TREE (expected $EXPECTED_TREE)" >&2
            git status --short >&2
            exit 1
          fi

          git config user.name 'polyth-blueprint-bot'
          git config user.email 'actions@users.noreply.github.com'
          COMMIT="$({
            printf '%s\n' 'Sync archived identity-governed workspace state'
            printf '\n'
            printf '%s\n' 'Recovered from archived source tree 84967cdf15f53c20ebb813bf11f62de676c1611b after a GitHub App workflow-permission rejection.'
          } | git commit-tree "$TREE" -p "$BASE")"

          git push \
            --force-with-lease="refs/heads/feat/identity-governed-workspaces-20260916:${{ github.sha }}" \
            origin "$COMMIT:refs/heads/feat/identity-governed-workspaces-20260916"
