name: Multi-user branch audit

on:
  push:
    branches:
      - feat/multi-user-account-management

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Browser-local persistence audit
        shell: bash
        run: |
          set -euo pipefail
          git grep -nE 'localStorage\.(getItem|setItem|removeItem)|sessionStorage\.(getItem|setItem|removeItem)' -- apps packages || true
      - name: Install workspace dependencies
        run: npm ci
      - name: Build web
        run: npm run build:web
      - name: Typecheck affected projects
        shell: bash
        run: |
          set -euo pipefail
          for project in packages/contracts packages/models packages/server packages/tenancy packages/tunnel apps/web; do
            if [ -f "$project/tsconfig.json" ]; then
              echo "::group::tsc $project"
              npx tsc --noEmit -p "$project"
              echo "::endgroup::"
            fi
          done
      - name: Run affected tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            packages/server/test/auth.test.ts \
            packages/server/test/settings.test.ts \
            packages/server/test/spaceIsolation.test.ts \
            packages/server/test/spaceMigration.test.ts \
            packages/tenancy/test/*.test.ts \
            packages/tunnel/test/*.test.ts \
            packages/session/test/profiles.test.ts \
            apps/web/test/*.test.ts
