name: Scorecard

# OpenSSF Scorecard: supply-chain checks of this repository (pinned actions,
# token permissions, branch protection, ...). Results go to code scanning and
# the public Scorecard API, which only accepts public repositories.
on:
  push:
    branches:
      - devel
  schedule:
    - cron: "27 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    if: ${{ !github.event.repository.private && vars.CI_DISABLED != '1' && vars.CI_DISABLED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
