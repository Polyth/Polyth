name: Harness model settings validation

on:
  pull_request:
    paths:
      - ".github/workflows/validate-harness-model-settings.yml"

permissions:
  contents: read

concurrency:
  group: harness-model-settings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build web packages and shell
        run: npm run build:web
      - name: Targeted tests
        run: >
          node --experimental-strip-types --test
          packages/server/test/modelVisibility.test.ts
          packages/harness-runtime/test/presentation.test.ts
          packages/harness-runtime/test/modelVisibilityRoutes.test.ts
          packages/models/test/harnessModelsPage.test.ts
