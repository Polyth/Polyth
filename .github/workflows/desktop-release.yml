name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform target
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_tag_release: ${{ steps.set-matrix.outputs.is_tag_release }}
    steps:
      - id: detect-windows-signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "${WIN_CSC_LINK:-}" ] && [ -n "${WIN_CSC_KEY_PASSWORD:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - id: set-matrix
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
          WINDOWS_SIGNING_CONFIGURED: ${{ steps.detect-windows-signing.outputs.configured }}
        run: |
          set -euo pipefail
          is_tag_release=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            is_tag_release=true
          fi
          echo "is_tag_release=${is_tag_release}" >> "$GITHUB_OUTPUT"

          declare -a entries=()
          add_entry() {
            entries+=("$1")
          }

          if [[ "$is_tag_release" == true || "$TARGET" == "all" || "$TARGET" == "linux" ]]; then
            add_entry '{"label":"Linux AppImage x64","os":"ubuntu-24.04","platform":"linux","arch":"x64","builder":"--linux AppImage --x64","e2e":true}'
            add_entry '{"label":"Linux AppImage arm64","os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64","builder":"--linux AppImage --arm64","e2e":false}'
          fi
          if [[ "$is_tag_release" == true || "$TARGET" == "all" || "$TARGET" == "macos" ]]; then
            add_entry '{"label":"macOS universal DMG + update ZIP","os":"macos-14","platform":"darwin","arch":"universal","builder":"--mac dmg zip --universal","e2e":false}'
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "windows" ]]; then
            if [[ "$is_tag_release" != true || "$WINDOWS_SIGNING_CONFIGURED" == "true" ]]; then
              add_entry '{"label":"Windows NSIS x64","os":"windows-2025","platform":"win32","arch":"x64","builder":"--win nsis --x64","e2e":false}'
              add_entry '{"label":"Windows NSIS arm64","os":"windows-2025","platform":"win32","arch":"arm64","builder":"--win nsis --arm64 --config.publish.channel=latest-arm64","e2e":false}'
            fi
          fi

          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "No desktop matrix entries selected for target=${TARGET}" >&2
            if [[ "$is_tag_release" == true && "$TARGET" == "all" && "$WINDOWS_SIGNING_CONFIGURED" != "true" ]]; then
              echo "Tag release continues without Windows because signing secrets are not configured." >&2
            fi
            exit 1
          fi

          matrix_json="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.label }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0
        if: matrix.platform != 'win32' && matrix.arch != 'universal'

      - uses: dtolnay/rust-toolchain@1.91.0
        if: matrix.arch == 'universal'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve aligned release version
        run: node scripts/release-version.mjs
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Validate macOS release signing and notarization secrets
        if: needs.plan.outputs.is_tag_release == 'true' && matrix.platform == 'darwin'
        shell: bash
        run: |
          for NAME in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!NAME}" || {
              echo "Required macOS release secret $NAME is not configured" >&2
              exit 1
            }
          done

      - name: Validate Windows release signing secrets
        if: needs.plan.outputs.is_tag_release == 'true' && matrix.platform == 'win32'
        shell: bash
        run: |
          for NAME in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            test -n "${!NAME}" || {
              echo "Required Windows release secret $NAME is not configured" >&2
              exit 1
            }
          done

      - name: Install workspace dependencies
        run: npm ci

      - name: Install both esbuild binaries for universal macOS
        if: matrix.arch == 'universal'
        shell: bash
        run: |
          ESBUILD_VERSION="$(node -p "require('./node_modules/esbuild/package.json').version")"
          npm install --ignore-scripts --no-save --package-lock=false --force \
            "@esbuild/darwin-x64@$ESBUILD_VERSION" \
            "@esbuild/darwin-arm64@$ESBUILD_VERSION"

      - name: Build web and desktop bundles
        run: npm run build:desktop
        env:
          POLYTH_MAC_UNIVERSAL: ${{ matrix.arch == 'universal' && '1' || '' }}

      - name: Download pinned OpenCode
        if: matrix.arch != 'universal'
        shell: bash
        run: POLYTH_TARGET_PLATFORM=${{ matrix.platform }} POLYTH_TARGET_ARCH=${{ matrix.arch }} npm run desktop:download-opencode

      - name: Download both pinned OpenCode binaries for universal macOS
        if: matrix.arch == 'universal'
        shell: bash
        run: |
          POLYTH_TARGET_PLATFORM=darwin POLYTH_TARGET_ARCH=x64 npm run desktop:download-opencode
          POLYTH_TARGET_PLATFORM=darwin POLYTH_TARGET_ARCH=arm64 npm run desktop:download-opencode

      - name: Package unsigned validation artifact
        if: needs.plan.outputs.is_tag_release != 'true'
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Package and publish release artifact
        if: needs.plan.outputs.is_tag_release == 'true'
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.builder }} --publish always

      - name: End-to-end test packaged AppImage
        if: matrix.platform == 'linux' && matrix.e2e
        shell: bash
        run: |
          APPIMAGE="$(ls apps/desktop/release/*.AppImage | sed -n '1p')"
          xvfb-run -a node apps/desktop/test/appimage-e2e.mjs \
            "$APPIMAGE" \
            "apps/desktop/release/appimage-e2e.png" \
            "apps/desktop/release/appimage-e2e.log" \
            "$GITHUB_WORKSPACE"

      - name: Verify packaged artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la apps/desktop/release
          case "${{ matrix.platform }}" in
            linux)
              artifacts=(apps/desktop/release/*.AppImage)
              ;;
            darwin)
              dmgs=(apps/desktop/release/*.dmg)
              zips=(apps/desktop/release/*.zip)
              if [ ${#dmgs[@]} -eq 0 ] || [ ${#zips[@]} -eq 0 ]; then
                echo "macOS packaging must emit both a DMG and a ZIP" >&2
                exit 1
              fi
              artifacts=("${dmgs[@]}" "${zips[@]}")
              ;;
            win32)
              artifacts=(apps/desktop/release/*.exe)
              ;;
            *)
              echo "unknown platform ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "no packaged artifacts for ${{ matrix.platform }}/${{ matrix.arch }}" >&2
            exit 1
          fi
          printf 'packaged %s\n' "${artifacts[@]}"

      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.is_tag_release != 'true'
        with:
          name: polyth-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/appimage-e2e.*
          if-no-files-found: error
