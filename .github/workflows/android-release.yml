name: Android release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the AAB to Google Play
        type: boolean
        required: true
        default: false
      track:
        description: Google Play track (only when publish=true)
        type: choice
        required: true
        default: internal
        options:
          - internal
          - production
  push:
    tags:
      - "v*"

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/release-quality.yml

  release:
    needs: quality-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve and validate release version
        run: node scripts/release-version.mjs
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Validate Android signing secrets
        shell: bash
        run: |
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!NAME}" || {
              echo "Required Android release secret $NAME is not configured" >&2
              exit 1
            }
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install workspace dependencies
        run: npm ci

      - name: Build web and sync Capacitor Android project
        run: npm run build:mobile

      - name: Decode Android keystore
        id: keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/android-signing/polyth-release.jks"
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed Android App Bundle
        working-directory: apps/mobile/android
        shell: bash
        run: >-
          ./gradlew :app:bundleRelease
          -PpolythVersionName="$POLYTH_VERSION"
          -PpolythVersionCode="$POLYTH_ANDROID_VERSION_CODE"
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: polyth-android-aab
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 14 || 7 }}
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Detect Google Play publish configuration
        id: play
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "track=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=${{ github.event.inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "track=${{ github.event.inputs.track }}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "track=internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Google Play internal track
        if: >-
          steps.play.outputs.configured == 'true'
          && steps.play.outputs.publish == 'true'
          && steps.play.outputs.track == 'internal'
        # v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.polyth.mobile
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
          releaseName: Polyth ${{ env.POLYTH_VERSION }}

      - name: Publish to Google Play production track (draft)
        if: >-
          steps.play.outputs.configured == 'true'
          && steps.play.outputs.publish == 'true'
          && steps.play.outputs.track == 'production'
        # v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.polyth.mobile
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          tracks: production
          status: draft
          releaseName: Polyth ${{ env.POLYTH_VERSION }}

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "${{ steps.keystore.outputs.path }}"
