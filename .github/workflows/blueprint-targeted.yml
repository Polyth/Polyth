name: Blueprint targeted validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Control-plane and identity typecheck
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p packages/control-plane/tsconfig.json
          node node_modules/typescript/bin/tsc --noEmit -p packages/identity/tsconfig.json
      - name: Identity blueprint targeted tests
        run: |
          node --experimental-strip-types --test \
            packages/control-plane/test/*.test.ts \
            packages/identity/test/*.test.ts \
            packages/plugins/test/authSocketRevocation.test.ts \
            packages/plugins/test/grantRevocationRpc.test.ts \
            packages/plugins/test/lifecycleAuth.test.ts \
            packages/plugins/test/plugins.test.ts \
            packages/plugins/test/spaceSecretVault.test.ts \
            packages/plugins/test/trustedServerLifecycle.test.ts \
            packages/plugins/test/trustedServerSpaceGate.test.ts \
            packages/secure-safe/test/spaceContextRouting.test.ts \
            packages/secure-safe/test/spaceOwnership.test.ts \
            packages/server/test/authorityOutbox.test.ts \
            packages/server/test/canonicalAuth.test.ts \
            packages/server/test/canonicalIdentityHttp.test.ts \
            packages/server/test/canonicalSecurity.test.ts \
            packages/server/test/canonicalSpaceAuthority.test.ts \
            packages/server/test/providerHost.test.ts \
            packages/server/test/runtimeSecurityBinding.test.ts \
            apps/web/test/accountProfile.test.ts \
            apps/web/test/authBootstrap.test.ts \
            apps/web/test/identityProviders.test.ts \
            apps/web/test/multiUserAccountScope.test.ts \
            apps/web/test/passkeys.test.ts \
            scripts/test/break-glass-password.test.ts \
            scripts/test/release-quality-gates.test.ts
      - name: Build web production bundle
        run: npm run build:web
