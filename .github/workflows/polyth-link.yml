name: Polyth Link

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/tunnel/**"
      - "packages/pairing-qr/**"
      - "packages/server/**"
      - "packages/contracts/**"
      - "packages/plugins/**"
      - "packages/terminal/**"
      - "apps/mobile/src/runtime.ts"
      - "apps/mobile/src/ConnectionScreen.tsx"
      - "apps/mobile/src/nativeBridge.ts"
      - "apps/mobile/test/**"
      - "apps/desktop/build.ts"
      - "apps/desktop/src/**"
      - "apps/desktop/test/**"
      - ".github/workflows/polyth-link.yml"
  workflow_dispatch:

concurrency:
  group: polyth-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build ws-echo helper for contract tests
        run: cargo build -p polyth-link-core --bin polyth-link-ws-echo

      - name: Polyth Link contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(node scripts/ci/select-tests.mjs polyth-link)
          node --experimental-strip-types --test "${tests[@]}"
