name: Harness capability validation workspace

on:
  push:
    branches: [fix/shared-harness-capability-context]
    paths: [.github/workflows/harness-capability-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package source and dependencies without Git credentials
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > "$RUNNER_TEMP/workspace-files"
          find . -type d -name node_modules -prune -print0 >> "$RUNNER_TEMP/workspace-files"
          tar -czf "$RUNNER_TEMP/polyth-workspace.tar.gz" --null -T "$RUNNER_TEMP/workspace-files"
      - uses: actions/upload-artifact@v4
        with:
          name: polyth-capability-workspace
          path: ${{ runner.temp }}/polyth-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
