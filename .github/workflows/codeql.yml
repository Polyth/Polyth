name: CodeQL

# CodeQL static analysis. Replaces the repository's CodeQL default setup with
# the same languages and build mode, so the configuration lives in the
# repository and supply-chain checks (Scorecard SAST) can see it. Results go
# to code scanning under the same /language:<lang> categories.
on:
  push:
    branches:
      - devel
      - master
  pull_request:
    branches:
      - devel
      - master
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Swift (the iOS app) is left out: it needs a macOS build to extract.
        language: [actions, c-cpp, csharp, java-kotlin, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
