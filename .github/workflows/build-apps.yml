name: Build apps
run-name: Build selected apps @ ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      android_apk:
        description: Android APK
        type: boolean
        default: false
      ios_simulator:
        description: iOS simulator app
        type: boolean
        default: false
      macos_x64:
        description: macOS DMG - Intel x64
        type: boolean
        default: false
      macos_arm64:
        description: macOS DMG - Apple Silicon arm64
        type: boolean
        default: false
      windows_x64:
        description: Windows EXE - x64
        type: boolean
        default: false
      windows_arm64:
        description: Windows EXE - arm64
        type: boolean
        default: false
      linux_x64:
        description: Linux AppImage - x64
        type: boolean
        default: false
      linux_arm64:
        description: Linux AppImage - arm64
        type: boolean
        default: false
      npm_packages:
        description: npm SDK packages
        type: boolean
        default: false
      docker_x64:
        description: Docker image - x64
        type: boolean
        default: false
      docker_arm64:
        description: Docker image - arm64
        type: boolean
        default: false
      docker_browser:
        description: Docker image with Chromium (polyth-browser target)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    if: inputs.android_apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle and sync Android
        run: npm run build:mobile

      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-android-apk
          retention-days: 5
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator app
    if: inputs.ios_simulator
    # Same toolchain as the signed builder: the Xcode 27.1 SDK runs edge to
    # edge on iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle and sync iOS
        run: npm run build:mobile

      - name: Build native Polyth Link framework
        run: npm --workspace @polyth/mobile run native:ios

      - name: Build unsigned simulator app
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/PolythDerivedData"
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$DERIVED/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Polyth-iOS.app.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-ios-app
          retention-days: 5
          path: ${{ runner.temp }}/Polyth-iOS.app.zip
          if-no-files-found: error

  macos:
    name: macOS DMG (${{ matrix.arch }})
    if: inputs.macos_x64 || inputs.macos_arm64
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.macos_x64 && inputs.macos_arm64 && '["x64","arm64"]' || inputs.macos_arm64 && '["arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Select macOS signing mode
        id: mac_signing
        env:
          SIGN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          MISSING=()
          test -n "$SIGN_CSC_LINK" || MISSING+=("CSC_LINK")
          test -n "$SIGN_CSC_KEY_PASSWORD" || MISSING+=("CSC_KEY_PASSWORD")
          test -n "$SIGN_APPLE_ID" || MISSING+=("APPLE_ID")
          test -n "$SIGN_APPLE_APP_SPECIFIC_PASSWORD" || MISSING+=("APPLE_APP_SPECIFIC_PASSWORD")
          test -n "$SIGN_APPLE_TEAM_ID" || MISSING+=("APPLE_TEAM_ID")

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## macOS signing"
              echo "Developer ID signing and Apple notarization enabled."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            MISSING_CSV="$(IFS=', '; echo "${MISSING[*]}")"
            echo "::warning::macOS signing/notarization secrets are incomplete (${MISSING_CSV}). Building ad-hoc signed smoke DMGs; these are not trusted release artifacts."
            {
              echo "## macOS signing"
              echo "Developer ID credentials are incomplete. Building ad-hoc signed smoke DMGs."
              echo
              echo "Missing: `${MISSING_CSV}`"
              echo
              echo "These artifacts are for testing only and are not equivalent to a notarized release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for macOS x64
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-x64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14

      - name: Install Chromium for macOS arm64
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-arm64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14-arm64

      - name: Install both esbuild binaries
        run: |
          ESBUILD_VERSION="$(node -p "require('./node_modules/esbuild/package.json').version")"
          npm install --ignore-scripts --no-save --package-lock=false --force \
            "@esbuild/darwin-x64@$ESBUILD_VERSION" \
            "@esbuild/darwin-arm64@$ESBUILD_VERSION"

      - name: Build multi-arch desktop bundle
        run: npm run build:desktop
        env:
          POLYTH_MAC_MULTI_ARCH: "1"

      - name: Stage Chromium for macOS x64
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-x64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14
          POLYTH_TARGET_PLATFORM: darwin
          POLYTH_TARGET_ARCH: x64

      - name: Stage Chromium for macOS arm64
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-arm64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14-arm64
          POLYTH_TARGET_PLATFORM: darwin
          POLYTH_TARGET_ARCH: arm64

      - name: Download OpenCode for both macOS architectures
        run: |
          POLYTH_TARGET_PLATFORM=darwin POLYTH_TARGET_ARCH=x64 npm run desktop:download-opencode
          POLYTH_TARGET_PLATFORM=darwin POLYTH_TARGET_ARCH=arm64 npm run desktop:download-opencode

      - name: Build Developer ID signed and notarized DMG
        if: steps.mac_signing.outputs.signed == 'true'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Build ad-hoc signed DMG
        if: steps.mac_signing.outputs.signed != 'true'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          for NAME in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ "${!NAME+x}" = "x" ]; then
              echo "$NAME must be unset for an ad-hoc macOS build" >&2
              exit 1
            fi
          done
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never \
            --config.mac.identity=- \
            --config.mac.notarize=false

      - name: Smoke-test packaged macOS app
        continue-on-error: true
        run: |
          set -euo pipefail
          NATIVE_ARCH="$(uname -m)"
          APP_BIN=""
          while IFS= read -r CANDIDATE; do
            if lipo -archs "$CANDIDATE" | tr ' ' '\n' | grep -qx "$NATIVE_ARCH"; then
              APP_BIN="$CANDIDATE"
              break
            fi
          done < <(find apps/desktop/release -path '*/Polyth.app/Contents/MacOS/Polyth' -type f -print)
          test -n "$APP_BIN" || { echo "No packaged Polyth.app matches runner architecture $NATIVE_ARCH" >&2; exit 1; }
          node apps/desktop/test/startup-smoke.mjs "$APP_BIN"

      - name: Verify packaged macOS signatures
        run: |
          set -euo pipefail
          FOUND=0
          while IFS= read -r APP; do
            FOUND=1
            codesign --verify --deep --strict --verbose=2 "$APP"
            if [ "${{ steps.mac_signing.outputs.signed }}" = "true" ]; then
              spctl --assess --type execute --verbose=4 "$APP"
            fi
          done < <(find apps/desktop/release -name 'Polyth.app' -type d -print)
          test "$FOUND" -eq 1 || { echo "No packaged Polyth.app found for signature verification" >&2; exit 1; }

      - name: Upload macOS x64 DMG
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-macos-dmg-x64-${{ steps.mac_signing.outputs.mode }}
          retention-days: 5
          path: apps/desktop/release/*-mac-x64.dmg
          if-no-files-found: error

      - name: Upload macOS arm64 DMG
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-macos-dmg-arm64-${{ steps.mac_signing.outputs.mode }}
          retention-days: 5
          path: apps/desktop/release/*-mac-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows EXE (${{ matrix.arch }})
    if: inputs.windows_x64 || inputs.windows_arm64
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.windows_x64 && inputs.windows_arm64 && '["x64","arm64"]' || inputs.windows_arm64 && '["arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Chromium
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Build desktop bundle
        run: npm run build:desktop

      - name: Stage Chromium
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          POLYTH_TARGET_PLATFORM: win32
          POLYTH_TARGET_ARCH: ${{ matrix.arch }}

      - name: Download pinned OpenCode
        run: npm run desktop:download-opencode
        env:
          POLYTH_TARGET_PLATFORM: win32
          POLYTH_TARGET_ARCH: ${{ matrix.arch }}

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never

      - name: Smoke-test packaged Windows app
        continue-on-error: true
        shell: pwsh
        run: |
          $app = Get-ChildItem "apps/desktop/release" -Recurse -Filter "Polyth.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $app) { throw "No packaged Polyth.exe found" }
          node apps/desktop/test/startup-smoke.mjs "$app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-windows-exe-${{ matrix.arch }}
          retention-days: 5
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  linux:
    name: Linux AppImage (${{ matrix.arch }})
    if: inputs.linux_x64 || inputs.linux_arm64
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.linux_x64 && inputs.linux_arm64 && '["x64","arm64"]' || inputs.linux_arm64 && '["arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Chromium
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Build desktop bundle
        run: npm run build:desktop

      - name: Stage Chromium
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          POLYTH_TARGET_PLATFORM: linux
          POLYTH_TARGET_ARCH: ${{ matrix.arch }}

      - name: Download pinned OpenCode
        run: npm run desktop:download-opencode
        env:
          POLYTH_TARGET_PLATFORM: linux
          POLYTH_TARGET_ARCH: ${{ matrix.arch }}

      - name: Build AppImage
        working-directory: apps/desktop
        run: npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never

      - name: Smoke-test packaged AppImage
        continue-on-error: true
        run: |
          set -euo pipefail
          APPIMAGE="$(find apps/desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          xvfb-run -a node apps/desktop/test/appimage-e2e.mjs \
            "$APPIMAGE" \
            "apps/desktop/release/appimage-e2e.png" \
            "apps/desktop/release/appimage-e2e.log" \
            "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-linux-appimage-${{ matrix.arch }}
          retention-days: 5
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/appimage-e2e.*
          if-no-files-found: error

  npm:
    name: npm SDK packages
    if: inputs.npm_packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate aligned versions
        run: node scripts/release-version.mjs

      - name: Pack public SDK packages
        run: |
          mkdir -p release/npm
          npm pack --workspace @polyth/contracts --pack-destination release/npm
          npm pack --workspace @polyth/package-sdk --pack-destination release/npm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-npm-packages
          retention-days: 5
          path: release/npm/*.tgz
          if-no-files-found: error

  docker:
    name: Docker image (${{ matrix.arch }})
    if: inputs.docker_x64 || inputs.docker_arm64
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.docker_x64 && inputs.docker_arm64 && '["x64","arm64"]' || inputs.docker_arm64 && '["arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      DOCKER_TARGET: ${{ inputs.docker_browser && 'polyth-browser' || 'polyth' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ env.DOCKER_TARGET }}
          load: true
          tags: polyth:${{ env.DOCKER_TARGET }}-${{ matrix.arch }}
          build-args: |
            POLYTH_WEB_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ env.DOCKER_TARGET }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.DOCKER_TARGET }}-${{ matrix.arch }}

      - name: Smoke-test image
        run: deploy/docker/smoke.sh "polyth:$DOCKER_TARGET-${{ matrix.arch }}"

      - name: Export image
        run: |
          set -euo pipefail
          mkdir -p release/docker
          docker save "polyth:$DOCKER_TARGET-${{ matrix.arch }}" \
            | gzip -1 > "release/docker/polyth-$DOCKER_TARGET-linux-${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyth-docker-${{ env.DOCKER_TARGET }}-${{ matrix.arch }}
          retention-days: 5
          compression-level: 0
          path: release/docker/*.tar.gz
          if-no-files-found: error
