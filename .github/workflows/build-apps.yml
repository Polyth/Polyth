name: Build apps
run-name: Build ${{ inputs.target }} @ ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifact to build
        required: true
        type: choice
        default: android-apk
        options:
          - android-apk
          - ios-app
          - mac-dmg
          - windows-exe
          - linux-appimage
          - npm-packages
          - all

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    if: inputs.target == 'android-apk' || inputs.target == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle and sync Android
        run: npm run build:mobile

      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: polyth-android-apk
          retention-days: 14
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator app
    if: inputs.target == 'ios-app' || inputs.target == 'all'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle and sync iOS
        run: npm run build:mobile

      - name: Build native Polyth Link framework
        run: npm --workspace @polyth/mobile run native:ios

      - name: Build unsigned simulator app
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/PolythDerivedData"
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$DERIVED/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Polyth-iOS.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: polyth-ios-app
          retention-days: 14
          path: ${{ runner.temp }}/Polyth-iOS.app.zip
          if-no-files-found: error

  macos:
    name: macOS DMG
    if: inputs.target == 'mac-dmg' || inputs.target == 'all'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Select macOS signing mode
        id: mac_signing
        run: |
          set -euo pipefail
          MISSING=()
          for NAME in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!NAME}" || MISSING+=("$NAME")
          done

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## macOS signing"
              echo "Developer ID signing and Apple notarization enabled."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            MISSING_CSV="$(IFS=', '; echo "${MISSING[*]}")"
            echo "::warning::macOS signing/notarization secrets are incomplete (${MISSING_CSV}). Building ad-hoc signed smoke DMGs; these are not trusted release artifacts."
            {
              echo "## macOS signing"
              echo "Developer ID credentials are incomplete. Building ad-hoc signed smoke DMGs."
              echo
              echo "Missing: `${MISSING_CSV}`"
              echo
              echo "These artifacts are for testing only and are not equivalent to a notarized release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for macOS x64
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-x64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14

      - name: Install Chromium for macOS arm64
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-arm64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14-arm64

      - name: Install both esbuild binaries
        run: |
          ESBUILD_VERSION="$(node -p "require('./node_modules/esbuild/package.json').version")"
          npm install --ignore-scripts --no-save --package-lock=false --force \
            "@esbuild/darwin-x64@$ESBUILD_VERSION" \
            "@esbuild/darwin-arm64@$ESBUILD_VERSION"

      - name: Build multi-arch desktop bundle
        run: npm run build:desktop
        env:
          POLYTH_MAC_MULTI_ARCH: "1"

      - name: Stage Chromium for macOS x64
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-x64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14
          POLYTH_TARGET_PLATFORM: darwin
          POLYTH_TARGET_ARCH: x64

      - name: Stage Chromium for macOS arm64
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-mac-arm64
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: mac14-arm64
          POLYTH_TARGET_PLATFORM: darwin
          POLYTH_TARGET_ARCH: arm64

      - name: Download OpenCode for both macOS architectures
        run: |
          POLYTH_TARGET_PLATFORM=darwin POLYTH_TARGET_ARCH=x64 npm run desktop:download-opencode
          POLYTH_TARGET_PLATFORM=darwin POLYTH_TARGET_ARCH=arm64 npm run desktop:download-opencode

      - name: Build x64 + arm64 DMG
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [ "${{ steps.mac_signing.outputs.signed }}" = "true" ]; then
            npx electron-builder --mac dmg --x64 --arm64 --publish never
          else
            CSC_LINK= \
            CSC_KEY_PASSWORD= \
            APPLE_ID= \
            APPLE_APP_SPECIFIC_PASSWORD= \
            APPLE_TEAM_ID= \
            npx electron-builder --mac dmg --x64 --arm64 --publish never \
              -c.mac.identity=- \
              -c.mac.notarize=false
          fi

      - name: Smoke-test packaged macOS app
        run: |
          set -euo pipefail
          NATIVE_ARCH="$(uname -m)"
          APP_BIN=""
          while IFS= read -r CANDIDATE; do
            if lipo -archs "$CANDIDATE" | tr ' ' '\n' | grep -qx "$NATIVE_ARCH"; then
              APP_BIN="$CANDIDATE"
              break
            fi
          done < <(find apps/desktop/release -path '*/Polyth.app/Contents/MacOS/Polyth' -type f -print)
          test -n "$APP_BIN" || { echo "No packaged Polyth.app matches runner architecture $NATIVE_ARCH" >&2; exit 1; }
          node apps/desktop/test/startup-smoke.mjs "$APP_BIN"

      - name: Verify packaged macOS signatures
        run: |
          set -euo pipefail
          FOUND=0
          while IFS= read -r APP; do
            FOUND=1
            codesign --verify --deep --strict --verbose=2 "$APP"
            if [ "${{ steps.mac_signing.outputs.signed }}" = "true" ]; then
              spctl --assess --type execute --verbose=4 "$APP"
            fi
          done < <(find apps/desktop/release -name 'Polyth.app' -type d -print)
          test "$FOUND" -eq 1 || { echo "No packaged Polyth.app found for signature verification" >&2; exit 1; }

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: polyth-macos-dmg-x64-${{ steps.mac_signing.outputs.mode }}
          retention-days: 14
          path: apps/desktop/release/*-mac-x64.dmg
          if-no-files-found: error

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: polyth-macos-dmg-arm64-${{ steps.mac_signing.outputs.mode }}
          retention-days: 14
          path: apps/desktop/release/*-mac-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows EXE
    if: inputs.target == 'windows-exe' || inputs.target == 'all'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Chromium
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Build desktop bundle
        run: npm run build:desktop

      - name: Stage Chromium
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          POLYTH_TARGET_PLATFORM: win32
          POLYTH_TARGET_ARCH: x64

      - name: Download pinned OpenCode
        run: npm run desktop:download-opencode
        env:
          POLYTH_TARGET_PLATFORM: win32
          POLYTH_TARGET_ARCH: x64

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Smoke-test packaged Windows app
        run: node apps/desktop/test/startup-smoke.mjs "apps/desktop/release/win-unpacked/Polyth.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: polyth-windows-exe
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  linux:
    name: Linux AppImage
    if: inputs.target == 'linux-appimage' || inputs.target == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: Swatinem/rust-cache@v2

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Chromium
        run: npx playwright-core install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Build desktop bundle
        run: npm run build:desktop

      - name: Stage Chromium
        run: npm run desktop:stage-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
          POLYTH_TARGET_PLATFORM: linux
          POLYTH_TARGET_ARCH: x64

      - name: Download pinned OpenCode
        run: npm run desktop:download-opencode
        env:
          POLYTH_TARGET_PLATFORM: linux
          POLYTH_TARGET_ARCH: x64

      - name: Build AppImage
        working-directory: apps/desktop
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Smoke-test packaged AppImage
        run: |
          set -euo pipefail
          APPIMAGE="$(find apps/desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          xvfb-run -a node apps/desktop/test/appimage-e2e.mjs \
            "$APPIMAGE" \
            "apps/desktop/release/appimage-e2e.png" \
            "apps/desktop/release/appimage-e2e.log" \
            "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: polyth-linux-appimage
          retention-days: 14
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/appimage-e2e.*
          if-no-files-found: error

  npm:
    name: npm SDK packages
    if: inputs.target == 'npm-packages' || inputs.target == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate aligned versions
        run: node scripts/release-version.mjs

      - name: Pack public SDK packages
        run: |
          mkdir -p release/npm
          npm pack --workspace @polyth/contracts --pack-destination release/npm
          npm pack --workspace @polyth/package-sdk --pack-destination release/npm

      - uses: actions/upload-artifact@v4
        with:
          name: polyth-npm-packages
          retention-days: 14
          path: release/npm/*.tgz
          if-no-files-found: error
