name: Fuzz

# cargo-fuzz targets for the Polyth Link parsers (fuzz/). Local run:
#   cd fuzz && CARGO_BUILD_JOBS=2 cargo +nightly fuzz run <target> -- -max_total_time=60
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "300"

permissions:
  contents: read

# Set the repository Actions variable CI_DISABLED=1 (or true) to skip this run
# before a runner is allocated, like ci.yml.
jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: >-
      ${{
        vars.CI_DISABLED != '1' &&
        vars.CI_DISABLED != 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - ticket_parse
          - numeric_wire
          - protocol_heads
          - ws_frames
          - http_head
          - stream_readers
          - string_validators
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        # `+nightly` beats the repository's rust-toolchain.toml (stable 1.91.0);
        # cargo-fuzz needs nightly's -Z sanitizer flags.
        run: |
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
          if-no-files-found: ignore
