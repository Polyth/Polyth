name: Temporary composition verification bootstrap
on:
  push:
    branches: [feat/project-composition-20260916]
    paths: [.github/workflows/composition-verification-bootstrap.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bundle only installed dependencies for isolated local verification
        shell: bash
        run: |
          set -euo pipefail
          find node_modules packages apps -type d -name node_modules -prune -print0 > /tmp/polyth-dependency-paths
          tar --null -T /tmp/polyth-dependency-paths -czf /tmp/polyth-verification-dependencies.tar.gz
          node --version > /tmp/polyth-verification-runtime.txt
          sha256sum package-lock.json >> /tmp/polyth-verification-runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: polyth-verification-dependencies
          path: |
            /tmp/polyth-verification-dependencies.tar.gz
            /tmp/polyth-verification-runtime.txt
          retention-days: 1
