name: Finalize multi-user account

on:
  push:
    branches:
      - feat/multi-user-account-management
    paths:
      - scripts/finalize-multi-user-account.mjs
      - .github/workflows/finalize-multi-user-account.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-multi-user-account
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply guarded finalization
        run: |
          set -euo pipefail
          node scripts/finalize-multi-user-account.mjs
          git diff --check

      - name: Install workspace dependencies
        run: npm ci

      - name: Build web packages and shell
        run: npm run build:web

      - name: Typecheck affected TypeScript projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            packages/contracts
            packages/models
            packages/plugins
            packages/tenancy
            packages/server
            packages/tunnel
            apps/web
          )
          for project in "${projects[@]}"; do
            echo "::group::tsc $project"
            npx tsc --noEmit -p "$project"
            echo "::endgroup::"
          done

      - name: Run account and tenancy regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            packages/server/test/auth.test.ts \
            packages/server/test/accountRoutes.test.ts \
            packages/server/test/multiUserAccounts.test.ts \
            packages/server/test/settings.test.ts \
            packages/server/test/spaceIsolation.test.ts \
            packages/tenancy/test/pairedIdentity.test.ts \
            apps/web/test/multiUserAccountScope.test.ts \
            packages/tunnel/test/accountIsolation.test.ts \
            packages/tunnel/test/store.test.ts \
            packages/tunnel/test/routes.test.ts \
            packages/tunnel/test/pairingCommit.test.ts

      - name: Run Polyth Link selected tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(node scripts/ci/select-tests.mjs polyth-link)
          node --experimental-strip-types --test "${tests[@]}"

      - name: Commit validated implementation and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/finalize-multi-user-account.mjs .github/workflows/finalize-multi-user-account.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(accounts): finalize multi-user ownership boundaries"
          git push origin HEAD:feat/multi-user-account-management
