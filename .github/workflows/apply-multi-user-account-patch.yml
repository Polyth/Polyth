name: Apply multi-user account patch

on:
  push:
    branches:
      - feat/multi-user-account-management
    paths:
      - scripts/apply-multi-user-account-patch.mjs
      - .github/workflows/apply-multi-user-account-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-user-account-management
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply strict source patch
        run: node scripts/apply-multi-user-account-patch.mjs

      - name: Remove one-shot patch machinery
        run: rm scripts/apply-multi-user-account-patch.mjs .github/workflows/apply-multi-user-account-patch.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(accounts): enforce multi-user ownership boundaries"
          git push origin HEAD:feat/multi-user-account-management
