name: Antigravity merge gate

on:
  push:
    branches: [feat/antigravity-harness]
    paths:
      - "packages/backend-antigravity/**"
      - "packages/package-sdk/**"
      - "package-lock.json"
      - ".github/workflows/antigravity-merge-gate-once.yml"

permissions:
  contents: write

concurrency:
  group: antigravity-merge-gate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shared process supervisor
        run: npm run build:supervisor
      - name: Antigravity, SDK and adjacent harness tests
        run: >-
          node --experimental-strip-types --test
          packages/backend-antigravity/test/*.test.ts
          packages/package-sdk/test/*.test.ts
          packages/harness-runtime/test/features.test.ts
          packages/harness-runtime/test/registry.test.ts
          packages/harness-runtime/test/telemetry.test.ts
          packages/harness-runtime/test/executableDiscovery.test.ts
          packages/plugins/test/serverPackage.test.ts
      - name: Typecheck Antigravity
        run: npx --no-install tsc --noEmit -p packages/backend-antigravity/tsconfig.json
      - name: Typecheck package SDK
        run: npx --no-install tsc --noEmit -p packages/package-sdk/tsconfig.json
      - name: Build web
        run: npm run build:web
      - name: Remove one-time gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'polyth-antigravity-validation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/antigravity-merge-gate-once.yml
          git commit -m 'chore(antigravity): remove one-time merge gate'
          git push origin HEAD:refs/heads/feat/antigravity-harness
