name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/multi-user-account-management
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-multi-user-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/multi-user-account-management'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply strict multi-user source patch
        run: node scripts/apply-multi-user-account-patch.mjs

      - name: Restore CI and remove one-shot patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f scripts/apply-multi-user-account-patch.mjs .github/workflows/apply-multi-user-account-patch.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(accounts): enforce multi-user ownership boundaries"
          git push origin HEAD:feat/multi-user-account-management

  validate:
    if: github.event_name != 'push' || github.ref != 'refs/heads/feat/multi-user-account-management'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Resolve aligned release version metadata
        run: node scripts/release-version.mjs

      - name: Build web packages and shell
        run: npm run build:web

      - name: Typecheck TypeScript projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            packages/contracts
            packages/plugins
            packages/server
            packages/tunnel
            packages/terminal
            apps/mobile
            apps/desktop
          )
          for project in "${projects[@]}"; do
            echo "::group::tsc $project"
            npx tsc --noEmit -p "$project"
            echo "::endgroup::"
          done

      # Generic CI owns stable repository tests. Polyth Link contract tests are
      # selected by scripts/ci/select-tests.mjs and run only in polyth-link.yml.
      - name: Run stable repository tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(node scripts/ci/select-tests.mjs ci)
          node --experimental-strip-types --test "${tests[@]}"
