name: Co-authors

# A pull request's new commits must not credit an AI agent, model or harness as
# a Co-authored-by (see AGENTS.md). Only the commits the pull request adds are
# checked, so existing history with such trailers does not block every branch.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: co-authors-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  co-authors:
    name: Co-authors
    if: ${{ vars.CI_DISABLED != '1' && vars.CI_DISABLED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check agent co-authors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-co-authors.mjs "$BASE_SHA" "$HEAD_SHA"
