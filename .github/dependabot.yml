# Version updates go to devel, where every change lands first; master only
# receives promotions from devel (.github/workflows/promote.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # @types/node follows the declared runtime (.nvmrc / engines), not the
    # newest Node; raise it together with .nvmrc.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Release-only tooling (electron-builder, Capacitor CLI, sharp), kept out of
  # the root install; see docs/operations/releases.md.
  - package-ecosystem: npm
    directory: /tools/release
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      release-tools-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # opaque-ke 4.0.1 (Link pairing) is built on digest 0.10 and rand_core
    # 0.6: OsRng and Sha512 are passed straight into it, so these move only
    # together with an opaque-ke release on the newer traits.
    ignore:
      - dependency-name: sha2
        versions: [">=0.11"]
      - dependency-name: hmac
        versions: [">=0.13"]
      - dependency-name: rand
        versions: [">=0.9"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The node image follows .nvmrc and the rust image follows
    # rust-toolchain.toml; both majors/toolchains move with those files.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: rust
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: devel
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Actions are pinned to commit SHAs with the version in a trailing comment,
    # which Dependabot keeps in step. The Rust toolchain action follows
    # rust-toolchain.toml instead of its own releases.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
