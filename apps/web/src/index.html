<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polyth</title>
    <!-- Root-absolute asset URLs (EXT-SEAMS-V3): this shell is also served as
         the SPA fallback for nested routes like /p/:projectId/s/:sessionId, so
         relative assets would resolve under the route and break refresh. -->
    <link rel="stylesheet" href="/main.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f49b5b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23' font-family='Georgia' font-weight='700' fill='%231b1713'%3Ep%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>window.__errs=[];const ce=console.error.bind(console);console.error=(...a)=>{__errs.push(a.map(String).join(' '));ce(...a)};window.addEventListener('error',e=>__errs.push('win:'+e.message));window.addEventListener('unhandledrejection',e=>__errs.push('rej:'+(e.reason&&e.reason.message||e.reason)));</script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
