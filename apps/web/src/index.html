<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polyth</title>
    <!-- Root-relative assets: the SPA fallback serves this page for deep links
         like /p/{project}/s/{session}, where relative URLs would resolve into
         the session path and break the bundle load on reload. -->
    <link rel="stylesheet" href="/bundle.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>window.__errs=[];const ce=console.error.bind(console);console.error=(...a)=>{__errs.push(a.map(String).join(' '));ce(...a)};window.addEventListener('error',e=>__errs.push('win:'+e.message));window.addEventListener('unhandledrejection',e=>__errs.push('rej:'+(e.reason&&e.reason.message||e.reason)));</script>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
