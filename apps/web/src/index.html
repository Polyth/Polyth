<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover exposes the safe-area insets used by the shell.
         UX-MOBILE-01 §45: resizes-content makes the OS shrink the layout
         viewport when the keyboard appears. Without it the page's bottom
         edge stays below the keyboard and the keyboard is hidden behind it:
         the composer is still "at the bottom of the page" — just offscreen.
         interactive-widget is harmlessly ignored by engines that use
         visualViewport geometry instead (iOS Safari 15.4+). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1b1713" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Polyth</title>
    <!-- Root-absolute asset URLs (EXT-SEAMS-V3): this shell is also served as
         the SPA fallback for nested routes like /p/:projectId/s/:sessionId, so
         relative assets would resolve under the route and break refresh. -->
    <link rel="stylesheet" href="/main.css" />
    <!-- A manifest fetch defaults to credentials=omit. Polyth can protect the
         shell with session authentication, so explicitly send the same-origin
         credentials that already authorized this document. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f49b5b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23' font-family='Georgia' font-weight='700' fill='%231b1713'%3Ep%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script>window.__errs=[];const ce=console.error.bind(console);console.error=(...a)=>{__errs.push(a.map(String).join(' '));ce(...a)};window.addEventListener('error',e=>__errs.push('win:'+e.message));window.addEventListener('unhandledrejection',e=>__errs.push('rej:'+(e.reason&&e.reason.message||e.reason)));</script>
    <script type="importmap">
      {
        "imports": {
          "react": "/shared/react.js",
          "react-dom": "/shared/react-dom.js",
          "react-dom/client": "/shared/react-dom-client.js",
          "react/jsx-runtime": "/shared/react-jsx-runtime.js",
          "react/jsx-dev-runtime": "/shared/react-jsx-dev-runtime.js"
        }
      }
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
