[workspace]
resolver = "2"
members = [
  "crates/polyth-link-core",
  "crates/polyth-link-host",
  "crates/polyth-link-client",
  "crates/polyth-link-relay",
  "crates/polyth-link-uniffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
iroh = "=1.1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
sha2 = "0.10.8"
hmac = "0.12.1"
hex = "0.4.3"
base64 = "0.22.1"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
ciborium = "0.2.2"
rand = "0.8.5"
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
